<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do anunciante | Tribuna das Cidades</title><link rel="stylesheet" href="assets/css/site.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header><div class="container"><h1>Tribuna <span>das Cidades</span></h1><nav><a href="index.html">Início</a><a href="classificados.html?categoria=imoveis">Ver classificados</a><a href="classificados-cadastro.html">Entrar / cadastro</a></nav></div></header>
    <main class="classified-form-page">
        <section id="client-login" class="classified-panel">
            <h2>Painel do anunciante</h2><p>Entre para cadastrar e editar seus anúncios.</p>
            <form id="client-login-form" class="classified-form">
                <label>E-mail<input id="client-email" type="email" autocomplete="email" required></label>
                <label>Senha<input id="client-password" type="password" autocomplete="current-password" required></label>
                <button class="btn btn-primary" type="submit">Entrar</button>
            </form>
            <p><a href="classificados-cadastro.html">Ainda não tem acesso? Solicite seu cadastro.</a></p>
            <div id="login-message" class="classified-message" aria-live="polite"></div>
        </section>

        <section id="client-dashboard" class="classified-panel" hidden>
            <div class="classified-dashboard-header"><div><h2>Meus anúncios</h2><p id="client-account-summary"></p></div><button id="client-logout" class="btn btn-secondary">Sair</button></div>
            <div id="client-status-message" class="classified-message" aria-live="polite"></div>
            <section class="client-branding">
                <div><h3>Identidade do anunciante</h3><p>Essa logo aparece junto aos seus anúncios.</p></div>
                <img id="client-logo-preview" class="client-logo-preview" alt="Logo do anunciante" hidden>
                <label>Logo<input id="client-logo-file" type="file" accept="image/png,image/jpeg,image/webp"></label>
                <button id="save-client-logo" class="btn btn-secondary" type="button">Atualizar logo</button>
                <div id="logo-message" class="classified-message" aria-live="polite"></div>
            </section>
            <div id="client-quotas" class="quota-list"></div>
            <form id="classified-ad-form" class="classified-form" hidden>
                <h3 id="ad-form-title">Novo anúncio</h3>
                <label>Categoria<select id="ad-category" required></select></label>
                <label>Título<input id="ad-title" type="text" maxlength="160" required></label>
                <label>Descrição<textarea id="ad-description" rows="5" maxlength="5000"></textarea></label>
                <div class="classified-form-grid">
                    <label id="ad-price-label">Preço (R$)<input id="ad-price" type="number" min="0" step="0.01" placeholder="350000"></label>
                    <label>Cidade<input id="ad-city" type="text" maxlength="100" placeholder="Ex.: Mogi Mirim"></label>
                </div>
                <label>Bairro<input id="ad-neighborhood" type="text" maxlength="100" placeholder="Ex.: Centro"></label>
                <div id="commerce-product-details" class="commerce-product-details" hidden>
                    <label>Categoria do produto<select id="ad-product-category" required><option value="">Selecione</option><option value="alimentos">Alimentos e bebidas</option><option value="mercados">Mercados e mercearias</option><option value="restaurantes">Restaurantes e lanchonetes</option><option value="padarias">Padarias e cafés</option><option value="moda">Moda e acessórios</option><option value="casa">Casa e decoração</option><option value="eletronicos">Eletrônicos</option><option value="beleza">Beleza e cuidados</option><option value="saude">Saúde e bem-estar</option><option value="automotivo">Automotivo</option><option value="pets">Pets</option><option value="servicos">Serviços</option><option value="outros">Outros</option></select></label>
                    <div class="classified-form-grid">
                        <label>Preço normal (R$)<input id="ad-original-price" type="number" min="0" step="0.01" placeholder="Opcional"></label>
                        <label>Oferta válida até<input id="ad-offer-ends" type="date"><small>Deixe em branco para um produto sem prazo de oferta.</small></label>
                    </div>
                </div>
                <div id="property-details" class="classified-form-grid">
                    <label>Tipo de imóvel<select id="ad-property-type"><option value="">Selecione</option><option>Casa</option><option>Apartamento</option><option>Terreno</option><option>Comercial</option><option>Rural</option><option>Outro</option></select></label>
                    <label>Quartos<input id="ad-bedrooms" type="number" min="0" max="99" step="1"></label>
                    <label>Vagas de garagem<input id="ad-parking" type="number" min="0" max="99" step="1"></label>
                </div>
                <label>WhatsApp com DDD<input id="ad-whatsapp" type="tel" maxlength="24" placeholder="Ex.: 5519999999999"></label>
                <label>Fotos do anúncio (até 6)<input id="ad-images" type="file" accept="image/png,image/jpeg,image/webp" multiple><small>Você pode manter as fotos atuais, remover alguma ou adicionar novas até completar 6.</small></label>
                <div id="ad-image-preview" class="ad-image-preview"></div>
                <label>Publicação<select id="ad-status"><option value="draft">Salvar como rascunho</option><option value="published">Publicar anúncio</option></select></label>
                <div class="classified-form-actions"><button class="btn btn-primary" type="submit">Salvar anúncio</button><button id="cancel-edit" class="btn btn-secondary" type="button" hidden>Cancelar edição</button></div>
                <div id="ad-form-message" class="classified-message" aria-live="polite"></div>
            </form>
            <h3>Anúncios cadastrados</h3><div id="client-ads-list" class="client-ads-list"></div>
        </section>
    </main>
    <script src="assets/js/config.js"></script><script src="assets/js/classificados-cliente.js"></script>
</body></html>
