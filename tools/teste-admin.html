<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Admin - Tribuna das Cidades</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        #editor-container { height: 200px; background: white; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:disabled { background: #ccc; }
        #status { margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Teste de Publicação</h2>
    
    <div class="form-group">
        <label>Título</label>
        <input type="text" id="title" value="Notícia de Teste">
    </div>

    <div class="form-group">
        <label>Categoria</label>
        <select id="category">
            <option value="Geral">Geral</option>
        </select>
    </div>

    <div class="form-group">
        <label>Conteúdo</label>
        <div id="editor-container"><p>Escreva algo aqui...</p></div>
    </div>

    <button id="btn-save">Salvar no Supabase</button>
    <p id="status"></p>

    <!-- 1. Biblioteca Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/config.js"></script>
    <!-- 2. DOMPurify -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <!-- 3. Quill -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

    <script>
        if (typeof window.supabase === 'undefined') {
            console.error('A biblioteca do Supabase não carregou!');
        }

        window.meuSupabase = db;
        
        // Teste rápido no console para você ver se funcionou
        console.log('Cliente Supabase criado com sucesso?', window.meuSupabase);

        // ==========================================
        // PASSO 3: LÓGICA DO EDITOR E SALVAMENTO
        // ==========================================
        const quill = new Quill('#editor-container', { theme: 'snow' });

        document.getElementById('btn-save').addEventListener('click', async () => {
            const btn = document.getElementById('btn-save');
            const status = document.getElementById('status');
            const title = document.getElementById('title').value;
            
            // Pega o HTML e limpa por segurança
            const rawHtml = quill.root.innerHTML;
            const cleanHtml = DOMPurify.sanitize(rawHtml);

            btn.disabled = true;
            btn.textContent = 'Salvando...';
            status.textContent = 'Conectando ao banco...';
            status.style.color = 'blue';

            try {
                // AQUI USAMOS 'meuSupabase' para ter certeza que é o cliente
                const { data, error } = await window.meuSupabase
                    .from('articles')
                    .insert([
                        {
                            title: title,
                            category: 'Geral',
                            content: cleanHtml,
                            status: 'Publicado',
                            published_at: new Date().toISOString()
                        }
                    ])
                    .select();

                if (error) throw error;

                status.textContent = '✅ Sucesso! Notícia salva.';
                status.style.color = 'green';
                console.log('Dados salvos:', data);

            } catch (error) {
                console.error('ERRO DETALHADO:', error);
                status.textContent = '❌ Erro: ' + error.message;
                status.style.color = 'red';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Salvar no Supabase';
            }
        });
    </script>
</body>
</html>
